<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bala Krishnan - Web Developer | Full Stack Developer</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      /* Reference color theme */
      --primary: rgb(53,53,53);
      --primary-light: rgb(85,85,85);
      --secondary: rgb(163,163,163);
      --dark: rgb(0,0,0);
      --light: rgb(250,250,250);
      --white: rgb(255,255,255);
      --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    /* SUSE Mono Variable Font */
    @font-face {
      font-family: 'SUSE Mono Variable';
      src: url('SUSEMono-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'SUSE Mono Variable', 'Space Mono', 'Courier New', monospace;
      background: var(--white);
      color: var(--dark);
      line-height: 1.6;
    }

    p { color: rgb(85,85,85); }

    /* TRANSITION */
    a, .btn { transition: all 300ms ease; }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      padding: 1rem 3rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--dark);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.2rem;
    }

    .nav-links a:hover {
      color: rgb(85,85,85);
      text-decoration: underline;
      text-underline-offset: 1rem;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 4px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background-color: var(--dark);
      transition: all 0.3s ease-in-out;
    }

    .mobile-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      padding: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 0.75rem;
      color: var(--dark);
      text-decoration: none;
      border-bottom: 1px solid var(--secondary);
    }

    /* SECTIONS */
    section {
      min-height: 100vh;
      padding: 6rem 2rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--dark);
      text-align: center;
    }

    .section-subtitle {
      color: rgb(85,85,85);
      font-size: 1.1rem;
      margin-bottom: 3rem;
      text-align: center;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4rem;
      padding-top: 8rem;
    }

    .hero-content {
      flex: 1;
    }

    .hero-greeting {
      color: var(--primary);
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .hero-name {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--dark);
    }

    .hero-role {
      font-size: 1.5rem;
      color: rgb(85,85,85);
      margin-bottom: 1.5rem;
    }

    .hero-description {
      font-size: 1.1rem;
      color: rgb(85,85,85);
      margin-bottom: 2rem;
      max-width: 600px;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 0.875rem 2rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: 0.1rem solid var(--primary);
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: rgb(85,85,85);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary);
    }

    .btn-secondary:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    .social-links {
      display: flex;
      gap: 1rem;
    }

    .social-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      text-decoration: none;
      transition: all 0.3s;
      border: 2px solid var(--primary);
    }

    .social-link:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    .hero-image {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .profile-image {
      width: 350px;
      height: 350px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* ABOUT SECTION */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .about-card {
      background: white;
      padding: 2rem;
      border-radius: 2rem;
      border: 0.1rem solid var(--secondary);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 1.5rem;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .about-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .about-card h3 {
      color: var(--primary);
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .about-card p {
      color: rgb(85,85,85);
      line-height: 1.8;
    }

    .about-image {
      display: flex;
      justify-content: center;
    }

    .about-pic {
      width: 600px;
      height: 1010px;
      border-radius: 2rem;
      object-fit: cover;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* EXPERIENCE SECTION */
    .experience-card {
      background: white;
      padding: 2.5rem;
      border-radius: 2rem;
      border: 0.1rem solid var(--secondary);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      margin: 0 auto;
    }

    .experience-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .experience-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
    }

    .experience-company {
      color: var(--primary);
      font-weight: 600;
    }

    .experience-duration {
      background: var(--light);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      color: rgb(85,85,85);
    }

    .experience-phase {
      margin: 1.5rem 0;
      padding: 1.5rem;
      background: var(--light);
      border-radius: 0.75rem;
      border-left: 4px solid var(--primary);
    }

    .experience-phase h4 {
      color: var(--dark);
      margin-bottom: 0.75rem;
    }

    .experience-phase ul {
      list-style: none;
      padding-left: 0;
    }

    .experience-phase li {
      color: rgb(85,85,85);
      margin-bottom: 0.5rem;
      padding-left: 1.5rem;
      position: relative;
    }

    .experience-phase li:before {
      content: "→";
      position: absolute;
      left: 0;
      color: var(--primary);
    }

    /* SKILLS SECTION */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .skill-category {
      background: white;
      padding: 2rem;
      border-radius: 2rem;
      border: 0.1rem solid var(--secondary);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .skill-category:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .skill-category h3 {
      color: var(--primary);
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .skill-tag {
      background: var(--light);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      color: var(--dark);
      border: 1px solid var(--secondary);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-tag:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .skill-level {
      font-size: 0.8rem;
      color: rgb(85,85,85);
    }

    .skill-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* PROJECTS SECTION */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background: white;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      border: 0.1rem solid var(--secondary);
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .project-image {
      height: 200px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-content {
      padding: 1.5rem;
    }

    .project-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .project-category {
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .project-description {
      color: rgb(85,85,85);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .project-features {
      margin-bottom: 1rem;
    }

    .project-features h4 {
      font-size: 0.9rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .feature-tag {
      background: var(--light);
      padding: 0.3rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      color: rgb(85,85,85);
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tech-tag {
      background: var(--light);
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      color: var(--dark);
      border: 1px solid var(--secondary);
    }

    .project-buttons {
      display: flex;
      gap: 0.75rem;
    }

    .project-btn {
      flex: 1;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s;
      font-size: 0.9rem;
      border: 0.1rem solid var(--primary);
    }

    .project-btn.github {
      background: var(--dark);
      color: white;
    }

    .project-btn.github:hover {
      background: rgb(85,85,85);
      transform: translateY(-2px);
    }

    .project-btn.demo {
      background: var(--primary);
      color: white;
    }

    .project-btn.demo:hover {
      background: rgb(85,85,85);
      transform: translateY(-2px);
    }

    /* CONTACT SECTION */
    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 0.1rem solid var(--secondary);
      transition: transform 0.3s;
    }

    .contact-item:hover {
      transform: translateX(4px);
    }

    .contact-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: rgb(11, 10, 10);
      font-size: 1.2rem;
    }

    .contact-details h4 {
      color: var(--dark);
      margin-bottom: 0.25rem;
    }

    .contact-details p {
      color: rgb(85,85,85);
      font-size: 0.95rem;
    }

    .contact-details a {
      color: var(--primary);
      text-decoration: none;
    }

    .contact-details a:hover {
      text-decoration: underline;
    }

    .contact-form {
      background: white;
      padding: 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 0.1rem solid var(--secondary);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--dark);
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.875rem;
      border: 0.08rem solid var(--secondary);
      border-radius: 0.9rem;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
      background: var(--white);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    /* FOOTER */
    footer {
      background: var(--dark);
      color: white;
      padding: 3rem 2rem;
      text-align: center;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .footer-nav a {
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-nav a:hover {
      color: var(--secondary);
    }

    .footer-copyright {
      color: var(--secondary);
      font-size: 0.9rem;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-content {
        order: 2;
      }

      .hero-image {
        order: 1;
      }

      .hero-buttons {
        justify-content: center;
      }

      .social-links {
        justify-content: center;
      }

      .about-grid,
      .contact-container {
        grid-template-columns: 1fr;
      }

      .about-image {
        order: -1;
      }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .hero-name {
        font-size: 2.5rem;
      }

      .hero-role {
        font-size: 1.2rem;
      }

      .section-title {
        font-size: 2rem;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      .profile-image {
        width: 250px;
        height: 250px;
      }

      .about-pic {
        width: 250px;
        height: 250px;
      }
    }

    @media (max-width: 480px) {
      section {
        padding: 5rem 1rem 3rem;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .project-buttons {
        flex-direction: column;
      }
    }

    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Navigation Component
    const Navigation = () => {
      const [isMenuOpen, setIsMenuOpen] = useState(false);

      const navLinks = [
        { name: 'Home', href: '#home' },
        { name: 'About', href: '#about' },
        { name: 'Experience', href: '#experience' },
        { name: 'Skills', href: '#skills' },
        { name: 'Projects', href: '#projects' },
        { name: 'Contact', href: '#contact' }
      ];

      return (
        <nav>
          <div className="nav-container">
            <a href="#home" className="logo">BK</a>
            <ul className="nav-links">
              {navLinks.map((link) => (
                <li key={link.name}>
                  <a href={link.href}>{link.name}</a>
                </li>
              ))}
            </ul>
            <div className="hamburger" onClick={() => setIsMenuOpen(!isMenuOpen)}>
              <span style={{ transform: isMenuOpen ? 'rotate(45deg) translate(5px, 5px)' : 'none' }}></span>
              <span style={{ opacity: isMenuOpen ? '0' : '1' }}></span>
              <span style={{ transform: isMenuOpen ? 'rotate(-45deg) translate(5px, -5px)' : 'none' }}></span>
            </div>
          </div>
          <div className={`mobile-menu ${isMenuOpen ? 'open' : ''}`}>
            {navLinks.map((link) => (
              <a 
                key={link.name} 
                href={link.href}
                onClick={() => setIsMenuOpen(false)}
              >
                {link.name}
              </a>
            ))}
          </div>
        </nav>
      );
    };

    // Hero Section
    const Hero = () => {
      return (
        <section id="home" className="hero">
          <div className="hero-content">
            <p className="hero-greeting">Hello, I'm</p>
            <h1 className="hero-name">Bala Krishnan</h1>
            <p className="hero-role">Web Developer | Full Stack Developer</p>
            <p className="hero-description">
              Computer Science Engineering student passionate about building modern web applications 
              and continuously learning new technologies.
            </p>
            <div className="hero-buttons">
              <a href="#contact" className="btn btn-primary">Contact Me</a>
              <a href="https://drive.google.com/file/d/1_SUBfz7SZQkbaqDQ0tNNxVPx_Ap6MD1N/view?usp=drivesdk" className="btn btn-secondary">Download Resume</a>
            </div>
            <div className="social-links">
              <a href="https://www.linkedin.com/in/bala-krishnan-5a2a582ba?utm_source=share_via&utm_content=profile&utm_medium=member_android" className="social-link" target="_blank" rel="noopener noreferrer">
                IN
              </a>
              <a href="https://github.com/bala30042006" className="social-link" target="_blank" rel="noopener noreferrer">
                GH
              </a>
            </div>
          </div>
          <div className="hero-image">
            <img src="./images/hero_img.png" alt="Bala Krishnan" className="profile-image" />
          </div>
        </section>
      );
    };

    // About Section
    const About = () => {
      return (
        <section id="about">
          <h2 className="section-title">About Me</h2>
          <p className="section-subtitle">Get to know me better</p>
          
          <div className="about-grid">
            <div className="about-content">
              <div className="about-card">
                <h3>Who I Am</h3>
                <p>
                  I am a Computer Science Engineering student with a strong interest in web development 
                  and full-stack technologies. I enjoy building practical web applications and learning 
                  new technologies. I have gained hands-on experience through a Web Development Internship 
                  and academic/personal projects. I am adaptable, a quick learner, and interested in 
                  solving real-world problems through technology.
                </p>
              </div>

              <div className="about-card">
                <h3>Education</h3>
                <p>
                  <strong>B.E. Computer Science and Engineering</strong><br/>
                  Jeppiaar Institute of Technology, Chennai<br/>
                  2023 – 2027
                </p>
              </div>

              <div className="about-card">
                <h3>Current Focus</h3>
                <p>
                  Currently exploring full-stack development with React.js, Node.js, and modern web 
                  technologies. Actively working on personal projects and continuously expanding my 
                  technical skills.
                </p>
              </div>
            </div>

            <div className="about-image">
              <img src="./images/about_img.jpg" alt="Bala Krishnan" className="about-pic" />
            </div>
          </div>
        </section>
      );
    };

    // Experience Section
    const Experience = () => {
      return (
        <section id="experience">
          <h2 className="section-title">Experience</h2>
          <p className="section-subtitle">My professional journey</p>
          
          <div className="experience-card">
            <div className="experience-header">
              <div>
                <h3 className="experience-title">Web Development Intern</h3>
                <p className="experience-company">[Company Name]</p>
              </div>
              <span className="experience-duration">40 Days</span>
            </div>

            <div className="experience-phase">
              <h4>Phase 1: Website Cloning</h4>
              <ul>
